[package]
name = "netusb-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4.3"
mdns-sd = "0.21.6"
netusb-common = { version = "0.1.0", path = "../common" }
netusb-proto = { version = "0.1.0", path = "../proto" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
