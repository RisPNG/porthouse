<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netusb</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f27; --muted: #6a7384; --line: #e2e5ea;
    --accent: #2563eb; --accent-ink: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #171b23; --ink: #e8ebf1; --muted: #8f99ab; --line: #272d38;
      --accent: #5b8def; --accent-ink: #0b0e14; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --chip: #212736;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 18px 16px 80px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .card > .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .card > .head .name { font-weight: 600; }
  .card > .head .addr { color: var(--muted); font-size: 13px; }
  .card > .head .spacer { flex: 1; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .row .info { flex: 1; min-width: 0; }
  .row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 12.5px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 13px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px;
  }
  .empty { color: var(--muted); padding: 14px; }
  .error { color: var(--bad); padding: 10px 14px; font-size: 13.5px; border-top: 1px solid var(--line); }
  form.inline { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  form.inline input { flex: 1; min-width: 140px; }
  #log { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; padding: 12px 14px; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>netusb</h1>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
</header>
<main>
  <h2>In use on this computer</h2>
  <div class="card" id="attached"></div>

  <h2>Servers</h2>
  <div id="servers"></div>

  <form class="card inline" id="addform" autocomplete="off">
    <input id="addaddr" placeholder="Add a server by address, e.g. 192.168.1.20" aria-label="Server address">
    <button class="primary" type="submit">Add</button>
  </form>

  <h2>Activity</h2>
  <div class="card"><div id="log"></div></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// All names below come from other computers on the network. They are only ever inserted with
// textContent, never as HTML.
const $ = (id) => document.getElementById(id);
const SPEED = { Low: "1.5 Mb/s", Full: "12 Mb/s", High: "480 Mb/s", Super: "5 Gb/s", SuperPlus: "10 Gb/s", Unknown: "" };
let pairingOpen = null;      // addr whose pairing form is open
let busy = new Set();        // ids with a request in flight
let last = null;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { credentials: "same-origin" } : {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function act(key, fn, okmsg) {
  if (busy.has(key)) return;
  busy.add(key); render();
  try { await fn(); if (okmsg) toast(okmsg); } catch (e) { toast(e.message); }
  busy.delete(key); await refresh();
}

const hex4 = (n) => n.toString(16).padStart(4, "0");
function devName(d) {
  return [d.manufacturer, d.product].filter(Boolean).join(" ") || "Unnamed device";
}

function renderAttached(s) {
  const box = $("attached"); box.replaceChildren();
  if (!s.attachments.length) { box.append(el("div", { class: "empty", text: "No devices in use. Pick one below." })); return; }
  s.attachments.forEach((a, i) => {
    const row = el("div", { class: "row", style: i ? "" : "border-top:0" },
      el("div", { class: "info" },
        el("div", { class: "title", text: `${hex4(a.vendor_id)}:${hex4(a.product_id)} from ${a.server_name}` }),
        el("div", { class: "sub", text: `${a.busid} · virtual port ${a.port}` })),
      el("button", { text: busy.has(a.id) ? "Releasing…" : "Release", ...(busy.has(a.id) ? { disabled: "" } : {}),
        onclick: () => act(a.id, () => api("/api/release", { id: a.id }), "Released") }));
    box.append(row);
  });
}

function renderServer(sv) {
  const card = el("div", { class: "card" });
  const state = sv.error ? el("span", { class: "chip bad", text: "unreachable" })
    : sv.paired ? el("span", { class: "chip ok", text: "paired" })
    : el("span", { class: "chip warn", text: "not paired" });
  const head = el("div", { class: "head" },
    el("div", {}, el("div", { class: "name", text: sv.name }), el("div", { class: "addr", text: sv.addr })),
    el("span", { class: "spacer" }), state);
  if (!sv.paired && !sv.error) {
    head.append(el("button", { class: "primary", text: pairingOpen === sv.addr ? "Cancel" : "Pair…",
      onclick: () => { pairingOpen = pairingOpen === sv.addr ? null : sv.addr; render(); } }));
  }
  card.append(head);
  if (sv.error) card.append(el("div", { class: "error", text: sv.error }));
  if (pairingOpen === sv.addr && !sv.paired) {
    const pin = el("input", { placeholder: "PIN from `netusb-server pair`, e.g. 1234-5678", inputmode: "numeric", "aria-label": "Pairing PIN", maxlength: "16" });
    const f = el("form", { class: "inline", autocomplete: "off",
      onsubmit: (ev) => { ev.preventDefault(); act("pair:" + sv.addr, async () => { await api("/api/pair", { addr: sv.addr, pin: pin.value }); pairingOpen = null; }, "Paired"); } },
      pin, el("button", { class: "primary", type: "submit", text: "Pair" }));
    card.append(f); setTimeout(() => pin.focus(), 0);
  }
  if (sv.paired && !sv.devices.length) card.append(el("div", { class: "empty", text: "No shareable devices on this server." }));
  for (const d of sv.devices) {
    const id = `${sv.addr}|${d.busid}`;
    const mine = s_attached.has(id);
    const other = d.in_use_by && !mine;
    const sub = [d.busid, `${hex4(d.vendor_id)}:${hex4(d.product_id)}`, SPEED[d.speed]].filter(Boolean).join(" · ");
    const btn = mine ? el("span", { class: "chip ok", text: "in use here" })
      : other ? el("span", { class: "chip", text: `in use by ${d.in_use_by}` })
      : el("button", { class: "primary", text: busy.has(id) ? "Connecting…" : "Use", ...(busy.has(id) ? { disabled: "" } : {}),
          onclick: () => {
            // A mouse or keyboard disappears from the machine sharing it, which can strand someone
            // who has no other way to control that machine. Make that explicit before taking it.
            if (d.input && !confirm(`"${devName(d)}" is a mouse or keyboard.\n\nWhile you use it here, ${sv.name} will not have it. Make sure ${sv.name} has another way to be controlled, and that you can release it from this page.\n\nUse it here?`)) return;
            act(id, () => api("/api/use", { addr: sv.addr, busid: d.busid }), "Connected");
          } });
    card.append(el("div", { class: "row" },
      el("div", { class: "info" }, el("div", { class: "title", text: devName(d) }), el("div", { class: "sub", text: sub })),
      d.input ? el("span", { class: "chip warn", title: "The sharing machine loses this device while you use it", text: "mouse / keyboard" }) : null, btn));
  }
  return card;
}

let s_attached = new Set();
function render() {
  const s = last; if (!s) return;
  $("who").textContent = s.user;
  s_attached = new Set(s.attachments.map((a) => a.id));
  renderAttached(s);
  const box = $("servers"); box.replaceChildren();
  if (!s.servers.length) box.append(el("div", { class: "card" }, el("div", { class: "empty", text: "Looking for servers on your network… You can also add one by address below." })));
  s.servers.forEach((sv) => box.append(renderServer(sv)));
  $("log").textContent = s.events.slice().reverse().map((l) => {
    const [t, m] = l.split("\t"); return new Date(+t * 1000).toLocaleTimeString() + "  " + m;
  }).join("\n") || "Nothing yet.";
}

async function refresh() {
  try { last = await api("/api/state"); render(); } catch (e) { toast("Lost contact with the netusb daemon"); }
}

$("addform").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const v = $("addaddr").value.trim(); if (!v) return;
  act("add", async () => { await api("/api/add_server", { addr: v }); $("addaddr").value = ""; }, "Server added");
});

refresh(); setInterval(() => { if (!pairingOpen) refresh(); }, 2500);
</script>
</body>
</html>
