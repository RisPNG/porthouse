name: release

# Push a tag such as v0.3.0 (after raising the version in Cargo.toml and adding its section to
# CHANGELOG.md) to publish. Every package is built and tested by the same workflows that run on
# each push, then collected here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the version in Cargo.toml and CHANGELOG.md
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$V" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $V" >&2; exit 1; }
          grep -q "^## $V " CHANGELOG.md || { echo "CHANGELOG.md has no section for $V" >&2; exit 1; }

  packages:
    needs: check
    uses: ./.github/workflows/packages.yml

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [packages, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: '{package-*,windows-installer}'
          merge-multiple: true
      - name: checksums and notes
        run: |
          V=${GITHUB_REF_NAME#v}
          mv assets/netusb.flatpak "assets/netusb-$V-x86_64.flatpak"
          (cd assets && sha256sum netusb* > SHA256SUMS && cat SHA256SUMS)
          awk -v v="$V" '$0 ~ "^## " v " " {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          cat notes.md
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "netusb ${GITHUB_REF_NAME#v}" --notes-file notes.md
