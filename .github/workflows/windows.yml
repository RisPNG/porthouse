name: windows

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: programs build, tests, smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: tests
        run: cargo test --workspace
      - name: build release
        run: cargo build --release --locked
      - name: smoke test of the Windows programs
        shell: pwsh
        run: ./scripts/ci/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          path: |
            target/release/porthouse-server.exe
            target/release/porthouse-clientd.exe
            target/release/porthouse-client.exe
          if-no-files-found: error

  attach:
    name: attach (real usbip-win2 driver, virtual mouse)
    needs: rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: target/release
      - name: install driver, attach, move the pointer
        shell: pwsh
        run: ./scripts/ci/windows-attach.ps1

  chain:
    name: engine (virtual WinUSB device shared by the native Windows server)
    needs: rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: target/release
      - name: engine test through a real WinUSB device
        shell: pwsh
        run: ./scripts/ci/windows-chain.ps1

  installer:
    name: installer (build the program, package, sign, install, use, remove)
    needs: rust
    runs-on: windows-2022
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: target/release
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: build the program
        shell: pwsh
        run: |
          cmake -S gui -B build\gui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build\gui
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: build the installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -GuiBuild build\gui
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: dist/porthouse-*-windows-x64-setup.exe
          if-no-files-found: error
      - name: sign the installer with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: use the signed installer from here on
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item dist\signed\*.exe dist\ -Force
          $sig = Get-AuthenticodeSignature (Get-ChildItem dist\porthouse-*-windows-x64-setup.exe).FullName
          Write-Host "signature status: $($sig.Status), signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'the installer is not validly signed' }
      - name: install, use, remove
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1 -Setup (Get-ChildItem dist\porthouse-*-windows-x64-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/porthouse-*-windows-x64-setup.exe
          if-no-files-found: error
