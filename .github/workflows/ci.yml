name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: linux build, lint, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show && rustup component add clippy rustfmt
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: security end-to-end (pairing, authorization, man-in-the-middle)
        run: |
          cargo build
          sudo apt-get install -y netcat-openbsd >/dev/null
          ./scripts/e2e-security.sh
      - name: web interface end-to-end
        run: ./scripts/e2e-ui.sh

  linux-attach:
    name: linux attach (real vhci_hcd, virtual mouse)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build
        run: cargo build
      - name: kernel modules
        run: |
          uname -r
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y usbutils python3-usb
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "no modules-extra package for this kernel (fine if vhci loads)"
          sudo modprobe vhci-hcd || true
          ls /sys/devices/platform | grep -i vhci || echo "no vhci_hcd platform device"
      - name: attach and move the pointer
        run: sudo env "PATH=$PATH" ./scripts/ci/linux-attach.sh

  windows:
    name: windows build, tests, smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: tests
        run: cargo test --workspace
      - name: build release
        run: cargo build --release
      - name: smoke test of the Windows programs
        shell: pwsh
        run: ./scripts/ci/windows-smoke.ps1
      - name: assemble the release zip
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: netusb-windows-x64
          path: dist/netusb-*-windows-x64.zip

  windows-attach:
    name: windows attach (real usbip-win2 driver, virtual mouse)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build release
        run: cargo build --release
      - name: install driver, attach, move the pointer
        shell: pwsh
        run: ./scripts/ci/windows-attach.ps1

  windows-installer:
    name: windows installer scripts (real scheduled tasks, firewall, state dirs)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build release
        run: cargo build --release
      - name: install, use, uninstall
        shell: pwsh
        run: ./scripts/ci/windows-installer.ps1

  linux-chain:
    name: linux engine (virtual device shared by the real usbfs engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build
        run: cargo build
      - name: kernel modules
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y usbutils
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "no modules-extra package for this kernel"
          sudo modprobe vhci-hcd || true
      - name: engine test through a real kernel device
        run: sudo env "PATH=$PATH" ./scripts/ci/linux-chain.sh

  windows-chain:
    name: windows engine (virtual WinUSB device shared by the native Windows server)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build release
        run: cargo build --release
      - name: engine test through a real WinUSB device
        shell: pwsh
        run: ./scripts/ci/windows-chain.ps1

  linux-package:
    name: linux release archive (static build, installed on real systemd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y musl-tools netcat-openbsd >/dev/null
      - name: build the release archive
        run: ./scripts/package-linux.sh
      - name: the shipped binaries pass the security and web-interface suites
        run: |
          tar -xzf dist/netusb-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          export NETUSB_BIN_DIR=$(echo "$RUNNER_TEMP"/netusb-*-linux-x86_64)
          file "$NETUSB_BIN_DIR/netusb-server"
          ./scripts/e2e-security.sh
          ./scripts/e2e-ui.sh
      - name: install, pair, use and uninstall exactly as the README says
        run: sudo env "PATH=$PATH" ./scripts/ci/linux-install.sh dist/netusb-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: netusb-linux-x86_64
          path: dist/netusb-*-linux-x86_64.tar.gz

  linux-deadpeer:
    name: linux dead-client detection (a vanished client releases its device)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show
      - name: build
        run: cargo build
      - name: black-hole the client and check the server lets go
        run: sudo env "PATH=$PATH" ./scripts/ci/linux-deadpeer.sh
