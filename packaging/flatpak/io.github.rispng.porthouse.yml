app-id: io.github.rispng.porthouse
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: porthouse

# Only the program is sandboxed. The services run on the host (install the porthouse package) and
# the program reaches them through their sockets in /run/porthouse.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=/run/porthouse
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: porthouse
    buildsystem: cmake-ninja
    subdir: gui
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
    post-install:
      - install -Dm644 ../LICENSE /app/share/licenses/io.github.rispng.porthouse/LICENSE
      - mv /app/share/applications/porthouse.desktop /app/share/applications/io.github.rispng.porthouse.desktop
      - mv /app/share/icons/hicolor/scalable/apps/porthouse.svg /app/share/icons/hicolor/scalable/apps/io.github.rispng.porthouse.svg
      - sed -i 's/^Icon=porthouse/Icon=io.github.rispng.porthouse/' /app/share/applications/io.github.rispng.porthouse.desktop
